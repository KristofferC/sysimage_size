<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Julia Sysimage Size Analysis</title>
  <!-- Include Plotly.js explicitly with version 2.24.1 -->
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    h1, h2 {
      text-align: center;
    }
    #plot {
      width: 80%;
      margin: auto;
    }
    /* Container for two columns */
    #columns-container {
      display: flex;
      justify-content: space-between;
      margin: 40px auto;
      width: 80%;
    }
    .column {
      width: 48%;
    }
    .column h3 {
      text-align: center;
    }
    .column ul {
      list-style-type: none;
      padding: 0;
    }
    .column li {
      margin: 8px 0;
      font-size: 16px;
    }
    .column a {
      text-decoration: none;
      color: blue;
      font-family: monospace;
    }
    .arrow-up {
      color: red;
      font-size: 18px;
      vertical-align: middle;
    }
    .arrow-down {
      color: green;
      font-size: 18px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<h1>Julia Sysimage Size Analysis</h1>

<!-- Plot container -->
<div id="plot"></div>

<h2>Significant Size Changes (> 1%)</h2>
<!-- Container for two columns (Increases and Decreases) -->
<div id="columns-container">
  <div class="column" id="increases-column">
    <h3>Increases</h3>
    <ul id="increases-list">
      <!-- Increases will be inserted here -->
    </ul>
  </div>
  <div class="column" id="decreases-column">
    <h3>Decreases</h3>
    <ul id="decreases-list">
      <!-- Decreases will be inserted here -->
    </ul>
  </div>
</div>

<script>
  // --- CSV Data ---
  const csvData = `___SYSIMAGE_SIZE_DATA___`;

  // --- Parse CSV Data ---
  const rows = csvData.split('\n');
  // Assume the first row is the header
  const commits = rows.slice(1).map(row => {
    const [commit, size, date] = row.split(' ');
    return { commit, size: Number(size), date };
  });

  // Sort commits by date (chronologically)
  commits.sort((a, b) => new Date(a.date) - new Date(b.date));

  // Prepare arrays for Plotly chart
  const dates = commits.map(item => new Date(item.date));
  const sizes = commits.map(item => item.size);
  // Full commit hash array (for click events)
  const commitHashes = commits.map(item => item.commit);
  // Short commit version (first 10 characters) for display in hover text
  const shortCommits = commitHashes.map(c => c.substring(0,7));

  // --- Create Plotly Chart ---
  const trace = {
    x: dates,
    y: sizes,
    mode: 'lines+markers',
    type: 'scatter',
    marker: { size: 8 },
    customdata: commitHashes, // full commit hash for each point
    text: shortCommits,       // short commit for display
    hovertemplate:
      'Commit: %{text}<br>' +
      'Date: %{x}<br>' +
      'Size: %{y}<extra></extra>'
  };

  const layout = {
    title: 'Sysimage Size Over Time',
    xaxis: {
      title: 'Date',
      type: 'date'
    },
    yaxis: {
      title: 'Size'
    }
  };

  Plotly.newPlot('plot', [trace], layout);

  // --- Add Click Event Handler to Chart ---
  document.getElementById('plot').on('plotly_click', function(data) {
    if (data.points.length > 0) {
      const commit = data.points[0].customdata;
      window.open('https://github.com/JuliaLang/julia/commit/' + commit, '_blank');
    }
  });

  // --- Compute Significant Size Changes ---
  // A change is considered significant if it is > 1%
  const threshold = 0.01;
  // Arrays to collect increases and decreases separately
  const significantIncreases = [];
  const significantDecreases = [];

  // Loop through commits to compute differences between successive commits
  for (let i = 1; i < commits.length; i++) {
    const prev = commits[i - 1];
    const curr = commits[i];
    const diff = curr.size - prev.size;
    const percentChange = diff / prev.size;

    if (Math.abs(percentChange) > threshold) {
      const changeItem = {
        commit: curr.commit,                          // full hash for URL
        shortCommit: curr.commit.substring(0, 7),      // short hash for display
        date: curr.date,
        diff,
        percentChange,
        absDiff: Math.abs(diff)
      };

      if (diff > 0) {
        significantIncreases.push(changeItem);
      } else {
        significantDecreases.push(changeItem);
      }
    }
  }

  // Sort each array by descending order of absolute diff
  significantIncreases.sort((a, b) => b.absDiff - a.absDiff);
  significantDecreases.sort((a, b) => b.absDiff - a.absDiff);

  // Function to convert bytes to megabytes (MB), with two-decimal places.
  const bytesToMB = bytes => (bytes / 1048576).toFixed(2);

  // --- Display Significant Increases ---
  const increasesList = document.getElementById('increases-list');
  significantIncreases.forEach(change => {
    const li = document.createElement('li');

    const arrow = document.createElement('span');
    arrow.textContent = '↑';
    arrow.className = 'arrow-up';
    li.appendChild(arrow);
    li.appendChild(document.createTextNode(' '));

    const link = document.createElement('a');
    link.href = 'https://github.com/JuliaLang/julia/commit/' + change.commit;
    link.target = '_blank';
    link.textContent = change.shortCommit;
    li.appendChild(link);

    li.appendChild(document.createTextNode(
      ` — ${(change.percentChange * 100).toFixed(2)}% change (${bytesToMB(change.diff)} MB) on ${change.date}`
    ));
    increasesList.appendChild(li);
  });

  // --- Display Significant Decreases ---
  const decreasesList = document.getElementById('decreases-list');
  significantDecreases.forEach(change => {
    const li = document.createElement('li');

    const arrow = document.createElement('span');
    arrow.textContent = '↓';
    arrow.className = 'arrow-down';
    li.appendChild(arrow);
    li.appendChild(document.createTextNode(' '));

    const link = document.createElement('a');
    link.href = 'https://github.com/JuliaLang/julia/commit/' + change.commit;
    link.target = '_blank';
    link.textContent = change.shortCommit;
    li.appendChild(link);

    li.appendChild(document.createTextNode(
      ` — ${(change.percentChange * 100).toFixed(2)}% change (${bytesToMB(change.diff)} MB) on ${change.date}`
    ));
    decreasesList.appendChild(li);
  });
</script>

</body>
</html>
